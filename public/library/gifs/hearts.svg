<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img">
<style>

  @keyframes bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes rise  { 0% { transform: translateY(10px); opacity: .55 } 50% { opacity: 1 } 100% { transform: translateY(-16px); opacity: .2 } }
  @keyframes tw    { 0%,100% { opacity: .55; transform: scale(.9) } 50% { opacity: 1; transform: scale(1.15) } }
  @keyframes sway  { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }
  @keyframes drift { 0% { transform: translateY(-6px) rotate(-8deg) } 100% { transform: translateY(10px) rotate(8deg) } }
  @keyframes pop   { 0%,100% { transform: scale(1) } 45% { transform: scale(1.1) } }

  .bob   { animation: bob 3.2s ease-in-out infinite; transform-origin: center }
  .rise  { animation: rise 2.8s ease-in-out infinite; transform-origin: center }
  .tw    { animation: tw 2.1s ease-in-out infinite; transform-origin: center }
  .sway  { animation: sway 2.6s ease-in-out infinite; transform-origin: 50% 90% }
  .drift { animation: drift 3.4s ease-in-out infinite alternate; transform-origin: center }
  .pop   { animation: pop 2.4s ease-in-out infinite; transform-origin: center }

  /* Motion is decoration; the composition above already reads without it. */
  @media (prefers-reduced-motion: reduce) {
    .bob, .rise, .tw, .sway, .drift, .pop { animation: none }
  }
</style>

  <g class="bob"><path transform="translate(40 44) scale(1.0625)" opacity="1" d="M16 29S1.5 20.4 1.5 10.8C1.5 5.4 5.6 1.5 10.4 1.5c3 0 5 1.6 5.6 3.4C16.6 3.1 18.6 1.5 21.6 1.5c4.8 0 8.9 3.9 8.9 9.3C30.5 20.4 16 29 16 29Z" fill="#e5789c"/></g>
  <g class="rise" style="animation-delay:.2s"><path transform="translate(18 60) scale(0.625)" opacity="0.9" d="M16 29S1.5 20.4 1.5 10.8C1.5 5.4 5.6 1.5 10.4 1.5c3 0 5 1.6 5.6 3.4C16.6 3.1 18.6 1.5 21.6 1.5c4.8 0 8.9 3.9 8.9 9.3C30.5 20.4 16 29 16 29Z" fill="#f2a5bd"/></g>
  <g class="rise" style="animation-delay:1.1s"><path transform="translate(72 56) scale(0.75)" opacity="0.9" d="M16 29S1.5 20.4 1.5 10.8C1.5 5.4 5.6 1.5 10.4 1.5c3 0 5 1.6 5.6 3.4C16.6 3.1 18.6 1.5 21.6 1.5c4.8 0 8.9 3.9 8.9 9.3C30.5 20.4 16 29 16 29Z" fill="#d95f83"/></g>
  <g class="tw" style="animation-delay:.5s"><path transform="translate(84 22) scale(0.6666666666666666)" opacity="1" d="M12 0c.9 6.6 4.5 10.4 12 12-7.5 1.6-11.1 5.4-12 12-.9-6.6-4.5-10.4-12-12C7.5 10.4 11.1 6.6 12 0Z" fill="#f0d9a4"/></g>
  <g class="tw" style="animation-delay:1.3s"><path transform="translate(16 26) scale(0.5)" opacity="1" d="M12 0c.9 6.6 4.5 10.4 12 12-7.5 1.6-11.1 5.4-12 12-.9-6.6-4.5-10.4-12-12C7.5 10.4 11.1 6.6 12 0Z" fill="#e8cb8e"/></g>
</svg>

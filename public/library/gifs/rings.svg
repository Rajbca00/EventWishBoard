<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Two rings">

  <defs>
    <clipPath id="ringclip">
      <circle cx="46" cy="66" r="22"/>
    </clipPath>
  </defs>
  <g transform="translate(46 66)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8"
        dur="3.6s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
      <circle r="20" fill="none" stroke="#d8a657" stroke-width="5"/>
      <circle r="20" fill="none" stroke="#f3dfae" stroke-width="1.6"/>
    </g>
  </g>
  <g transform="translate(74 60)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="9;-9;9"
        dur="3.6s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
      <circle r="17" fill="none" stroke="#e0b46a" stroke-width="4.4"/>
      <circle r="17" fill="none" stroke="#fdf1d6" stroke-width="1.4"/>
      <g transform="translate(0 -17)">
        <path d="M12 0c.9 6.6 4.5 10.4 12 12-7.5 1.6-11.1 5.4-12 12-.9-6.6-4.5-10.4-12-12C7.5 10.4 11.1 6.6 12 0Z" transform="translate(-12 -12) scale(0.42)" fill="#fff6dd">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="scale" values="0.3;0.55;0.3"
            dur="1.8s" repeatCount="indefinite" additive="sum"/>
        </path>
      </g>
    </g>
  </g>
  <g clip-path="url(#ringclip)">
    <rect x="-40" y="34" width="16" height="64" fill="#ffffff" opacity=".55"
          transform="rotate(18 46 66)">
      <animate attributeName="x" values="-40;96" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
